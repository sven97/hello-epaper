name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Native unit tests
        run: pio test -e native

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [ee02]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # version.py stamps FW_BUILD_NUMBER = git rev-list --count HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Firmware build
        run: pio run -e ${{ matrix.env }}
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          path: .pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error

  publish:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git rev-list --count needs full history
      - uses: actions/download-artifact@v4
        with:
          path: fw         # -> fw/fw-ee02/firmware.bin
      - name: Assemble assets + manifest
        run: |
          set -euo pipefail
          BUILD=$(git rev-list --count HEAD)
          HASH=$(git rev-parse --short=8 HEAD)
          mkdir dist
          cp fw/fw-ee02/firmware.bin dist/firmware-ee02.bin
          {
            echo "# generated by .github/workflows/ci.yml — do not edit"
            echo "build=$BUILD"
            echo "hash=$HASH"
            echo "md5_ee02=$(md5sum dist/firmware-ee02.bin | cut -d' ' -f1)"
          } > dist/manifest.txt
          cat dist/manifest.txt
      - name: Move firmware-latest release to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD=$(git rev-list --count HEAD)
          HASH=$(git rev-parse --short=8 HEAD)
          gh release delete firmware-latest --yes --cleanup-tag || true
          gh release create firmware-latest dist/* \
            --target "$GITHUB_SHA" \
            --title "Rolling firmware (build $BUILD)" \
            --notes "Auto-published from $HASH. Consumed by the on-device auto-update path (docs/superpowers/specs/2026-09-06-auto-firmware-update-design.md)." \
            --prerelease
