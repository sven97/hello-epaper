; Bare `pio run` / `pio run -t upload` target the firmware only; the native
; env is test-only (no sources to link) and is reached via `pio test -e native`.
[platformio]
default_envs = ee02

; The XIAO EE02 board: XIAO ESP32-S3 Plus + 13.3" Spectra-6 colour panel,
; 1200x1600, portrait-native (the default kit). This is the only supported
; hardware -- see docs/superpowers/specs/2026-09-09-paperframe-ee02-only-status-redesign-design.md.
[env:ee02]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Stamps FW_GIT_HASH (short commit hash, "-dirty" if uncommitted changes) and
; FW_BUILD_NUMBER (the auto-update ordering key + on-device version string).
; See tools/version.py and docs/versioning.md.
extra_scripts = pre:tools/version.py

; XIAO ESP32-S3 Plus has 16 MB flash (stock board def assumes 8 MB)
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git#a2de1abca0597c202193f22d01e9fa35d1ff613b
    bodmer/JPEGDecoder@^2.0.0
    tzapu/WiFiManager@^2.0.17
    ricmoo/QRCode@^0.0.1

; BOARD_SCREEN_COMBO / USE_XIAO_EPAPER_DISPLAY_BOARD_EE02 select the panel
; driver inside Seeed_GFX; the rest of the board's identity lives in
; src/config.h as plain constants.
build_flags =
    -DBOARD_SCREEN_COMBO=510
    -DUSE_XIAO_EPAPER_DISPLAY_BOARD_EE02

; Host-side unit tests for the pure logic in src/logic/ (no Arduino deps).
; Deliberately not the special [env] section -- no ESP32 board/framework/lib_deps.
[env:native]
platform = native
test_framework = unity
test_build_src = false
build_src_filter = -<*>
build_flags = -std=gnu++17 -I src
